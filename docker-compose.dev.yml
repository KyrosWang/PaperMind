services:
  backend:
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - paper_data:/data
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - paper_data:/data

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: pnpm dev

volumes:
  frontend_modules:

