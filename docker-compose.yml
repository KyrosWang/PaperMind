name: papermind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papermind}
      POSTGRES_USER: ${POSTGRES_USER:-papermind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papermind} -d ${POSTGRES_DB:-papermind}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.8.1
    init: true
    volumes:
      - grobid_models:/opt/grobid/grobid-home/models
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-papermind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-papermind}
      REDIS_URL: redis://redis:6379/0
      DATA_ROOT: /data
      GROBID_URL: http://grobid:8070
    volumes:
      - paper_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-papermind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-papermind}
      REDIS_URL: redis://redis:6379/0
      DATA_ROOT: /data
      GROBID_URL: http://grobid:8070
    volumes:
      - paper_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      API_URL: http://backend:8000/api
      APP_API_KEY: ${APP_API_KEY}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  paper_data:
  grobid_models:

