name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: papermind_ci
          POSTGRES_USER: papermind
          POSTGRES_PASSWORD: papermind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papermind -d papermind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://papermind:papermind@localhost:5432/papermind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check backend tests
      - run: ruff check backend tests
      - run: pytest
      - name: Verify migrations
        working-directory: backend
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          API_URL: http://localhost:8000/api
          APP_API_KEY: ci-only

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Compose
        run: POSTGRES_PASSWORD=ci APP_API_KEY=ci docker compose config --quiet
      - name: Build images
        run: POSTGRES_PASSWORD=ci APP_API_KEY=ci docker compose build backend frontend

